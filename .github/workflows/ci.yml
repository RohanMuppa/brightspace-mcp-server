name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows and macOS are not decoration here: the setup wizard wraps npx in
    # cmd /c only on Windows, and the config and session stores skip file modes
    # there. None of that was exercised by anything before this workflow.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Skips the postinstall Playwright chromium download. Nothing in the
      # test suite launches a browser, and the download is about 150 MB.
      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run build

      - name: Test
        run: npm run test:run
