name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    # Windows and macOS are not decoration here: the setup wizard wraps npx in
    # cmd /c only on Windows, and the config and session stores skip file modes
    # there. None of that was exercised by anything before this workflow.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Skips the postinstall Playwright chromium download. Nothing in the
      # default test suite launches a browser. Real-browser fixtures run opt-in.
      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run build

      - name: Test
        run: npm run test:run

  install-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Linux browser system dependencies
        if: runner.os == 'Linux'
        run: node node_modules/playwright/cli.js install-deps chromium
      - name: Published-package install and cleanup recovery (no sign-in)
        run: npm run test:install
