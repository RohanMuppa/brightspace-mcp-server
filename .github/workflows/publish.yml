name: Publish to npm

on:
  push:
    branches: [main]

# Publishing is serialized: two merges in a row once ran publish at the same
# time, and the older version finished last and took npm's `latest`.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Publish if version changed
        id: publish
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(npm view brightspace-mcp-server version 2>/dev/null || echo "0.0.0")
          # Only a version newer than npm's: a run for an older commit that
          # finishes late must not publish over a newer release.
          IS_NEWER=$(node -e '
            const n = (v) => v.split("-")[0].split(".").map(Number);
            const [a, b] = [n(process.argv[1]), n(process.argv[2])];
            let newer = false;
            for (let i = 0; i < 3; i++) {
              if ((a[i] || 0) !== (b[i] || 0)) { newer = (a[i] || 0) > (b[i] || 0); break; }
            }
            console.log(newer);
          ' "$CURRENT" "$PUBLISHED")
          if [ "$IS_NEWER" = "true" ]; then
            npm publish --provenance --access public
            echo "Published v$CURRENT"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $CURRENT is not newer than npm's $PUBLISHED, skipping"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Tags the commit npm just published and creates its GitHub release, so the
  # repo's releases and "Latest" follow npm instead of being made by hand.
  # Runs only after an actual npm publish, from that run's commit, and never
  # blocks it. A release that already exists (a re-run) is left alone.
  github-release:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Create the GitHub release for the published version
        run: |
          TAG="v${{ needs.publish.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Mirrors the npm release into the official MCP registry (registry.modelcontextprotocol.io)
  # so this server is discoverable there, not just on npm. Runs only after an actual npm
  # publish (see the `publish` job's `published` output) and never blocks npm publishing:
  # `continue-on-error` means a registry outage or an mcp-publisher failure shows up as a
  # yellow/failed `registry` job without failing the workflow overall.
  #
  # Docs followed: https://github.com/modelcontextprotocol/registry ->
  #   docs/modelcontextprotocol-io/github-actions.mdx (OIDC workflow + mcp-publisher install)
  #   docs/reference/cli/commands.md (mcp-publisher login/publish CLI reference)
  #   docs/contributing/add-package-registry.md (npm ownership verification via `mcpName`)
  registry:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    continue-on-error: true
    env:
      # Pin to a specific mcp-publisher release; bump deliberately, not via `latest`, so a
      # registry-side change can't silently alter CI behavior.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7

      - name: Verify server.json version matches package.json
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          SERVER_VERSION=$(jq -r '.version' server.json)
          PACKAGE_ENTRY_VERSION=$(jq -r '.packages[0].version' server.json)
          if [ "$PKG_VERSION" != "$SERVER_VERSION" ] || [ "$PKG_VERSION" != "$PACKAGE_ENTRY_VERSION" ]; then
            echo "::error::server.json versions ($SERVER_VERSION / packages[0] $PACKAGE_ENTRY_VERSION) do not match package.json ($PKG_VERSION) -- the registry rejects a version that doesn't match the published npm package, and will reject re-publishing a version it already has."
            exit 1
          fi
          MCP_NAME=$(jq -r '.mcpName // empty' package.json)
          if [ "$MCP_NAME" != "$(jq -r '.name' server.json)" ]; then
            echo "::error::package.json mcpName ($MCP_NAME) must equal server.json name ($(jq -r '.name' server.json)); the registry verifies npm ownership through it."
            exit 1
          fi

      - name: Wait for the npm registry to serve the new version
        run: |
          VERSION=$(jq -r '.version' package.json)
          for i in $(seq 1 12); do
            if [ "$(npm view "brightspace-mcp-server@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm serves $VERSION"; exit 0
            fi
            sleep 10
          done
          echo "::warning::npm did not serve $VERSION within 2 minutes; the registry's ownership check may fail"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: |
          for i in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt $i failed; retrying in 30s"; sleep 30
          done
          exit 1
