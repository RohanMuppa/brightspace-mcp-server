name: Publish to npm

on:
  push:
    branches: [main]

# Publishing is serialized: two merges in a row once ran publish at the same
# time, and the older version finished last and took npm's `latest`.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm run build

      # A stable version is published under the temporary dist-tag `staged`, and
      # `latest` moves to it only once npm serves its tarball: npm reports a new
      # version minutes before the tarball can be downloaded, and in that window
      # `npx brightspace-mcp-server@latest` could not start. `published` is true
      # only once the release is finished on npm, so the jobs below never run for
      # a version users cannot download. docs/internals/releasing.md has the rules.
      - name: Publish if version changed
        id: publish
        run: bash .github/scripts/npm-release.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Tags the commit npm just published and creates its GitHub release, so the
  # repo's releases and "Latest" follow npm instead of being made by hand.
  # Runs only once the version is published and, when stable, promoted to
  # `latest`, from that run's commit, and never blocks it. A release that
  # already exists (a re-run) is left alone.
  github-release:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Create the GitHub release for the published version
        run: |
          TAG="v${{ needs.publish.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Mirrors the npm release into the official MCP registry (registry.modelcontextprotocol.io)
  # so this server is discoverable there, not just on npm. Runs only after an actual npm
  # publish (see the `publish` job's `published` output) and never blocks npm publishing:
  # `continue-on-error` means a registry outage or an mcp-publisher failure shows up as a
  # yellow/failed `registry` job without failing the workflow overall.
  #
  # Docs followed: https://github.com/modelcontextprotocol/registry ->
  #   docs/modelcontextprotocol-io/github-actions.mdx (OIDC workflow + mcp-publisher install)
  #   docs/reference/cli/commands.md (mcp-publisher login/publish CLI reference)
  #   docs/contributing/add-package-registry.md (npm ownership verification via `mcpName`)
  registry:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    continue-on-error: true
    env:
      # Pin to a specific mcp-publisher release; bump deliberately, not via `latest`, so a
      # registry-side change can't silently alter CI behavior.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7

      - name: Verify server.json version matches package.json
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          SERVER_VERSION=$(jq -r '.version' server.json)
          PACKAGE_ENTRY_VERSION=$(jq -r '.packages[0].version' server.json)
          if [ "$PKG_VERSION" != "$SERVER_VERSION" ] || [ "$PKG_VERSION" != "$PACKAGE_ENTRY_VERSION" ]; then
            echo "::error::server.json versions ($SERVER_VERSION / packages[0] $PACKAGE_ENTRY_VERSION) do not match package.json ($PKG_VERSION) -- the registry rejects a version that doesn't match the published npm package, and will reject re-publishing a version it already has."
            exit 1
          fi
          MCP_NAME=$(jq -r '.mcpName // empty' package.json)
          if [ "$MCP_NAME" != "$(jq -r '.name' server.json)" ]; then
            echo "::error::package.json mcpName ($MCP_NAME) must equal server.json name ($(jq -r '.name' server.json)); the registry verifies npm ownership through it."
            exit 1
          fi

      # The registry's ownership check downloads the package, and npm can serve the version's
      # metadata minutes before its tarball (5.2.14: gave up after 2 minutes and the publish got a
      # 400; 5.2.16: the tarball URL answered 404 for about 5 minutes). The publish job has already
      # waited for both before moving `latest`; this checks again from this job, so that no path
      # (a prerelease, a re-run of this job alone) reaches a publish that will be refused.
      - name: Wait for the npm registry to serve the new version
        run: |
          NAME=$(jq -r '.name' package.json)
          VERSION=$(jq -r '.version' package.json)
          if ! bash .github/scripts/wait-for-npm.sh "$NAME" "$VERSION"; then
            echo "::error::npm did not serve both the metadata and the tarball of $NAME@$VERSION within 15 minutes, so the MCP Registry publish was not attempted (it would be refused). Re-run this job once npm serves the tarball."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: |
          for i in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt $i failed; retrying in 30s"; sleep 30
          done
          exit 1
